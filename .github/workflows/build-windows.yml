name: Windows инсталатор

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tesseract и Inno Setup
        run: choco install tesseract innosetup -y --no-progress

      - name: Изграждане
        shell: pwsh
        run: .\build.ps1

      - name: Качване на инсталатора
        uses: actions/upload-artifact@v4
        with:
          name: Bukvar-Setup
          path: Output/*.exe

      - name: Издание (при таг v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.exe
          generate_release_notes: true
