name: Windows инсталатор

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tesseract и Inno Setup
        run: choco install tesseract innosetup -y --no-progress

      - name: Изграждане
        shell: pwsh
        run: .\build.ps1

      - name: Качване на инсталатора
        uses: actions/upload-artifact@v4
        with:
          name: Bukvar-Setup
          path: Output/*.exe

      - name: Версия
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $v = (Select-String -Path "bukvar\__init__.py" -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Издание с директна връзка за изтегляне. Създава таг v<версия>,
      # ако го няма; при нова сборка на същата версия подменя .exe файла.
      - name: Издание
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Буквар ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: Output/*.exe
          fail_on_unmatched_files: true
          body: |
            Безплатна програма за разпознаване на текст (OCR) от сканирани документи и снимки.

            **Изтегляне:** `Bukvar-Setup-${{ env.VERSION }}.exe` по-долу, в „Assets“.

            Windows може да покаже „Windows защити компютъра ви“, защото инсталаторът не е подписан.
            Натиснете **Повече информация → Изпълни въпреки това**.
